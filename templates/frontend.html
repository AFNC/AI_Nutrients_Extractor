<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload File</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            
            background-image: url('ice-creams.jpg'); /* Replace with actual image URL */
            /*background-image: url({{ url_for ('static', filename = 'icecreams.jpg') }});*/
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            
        }
        .upload-box {
            background-color: rgba(255, 255, 255, 0.9);
            border: 2px dashed #ccc;
            padding: 40px;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        input[type="file"] {
            margin: 20px 0;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <form action="/upload" method="post" enctype="multipart/form-data">
        <div class="upload-box">
            <h2>Upload Product Label Image</h2>
            <input type="file" name="file" accept="image/*,.pdf" required>

            <br>
            <button type="submit">Upload</button>
        </div>
    </form>

</body>
</html>
