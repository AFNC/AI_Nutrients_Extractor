<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload File</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 50px;
            text-align: center;
        }
        .upload-box {
            border: 2px dashed #ccc;
            padding: 40px;
            width: 400px;
            margin: auto;
            background-color: #f9f9f9;
        }
        input[type="file"] {
            margin: 20px 0;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1>Upload Product Label (Image or PDF)</h1>
    <form action="/upload" method="post" enctype="multipart/form-data">
        <div class="upload-box">
            <input type="file" name="file" accept="image/*,.pdf" required>
            <br>
            <button type="submit">Upload</button>
        </div>
    </form>

</body>
</html>
